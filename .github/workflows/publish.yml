name: Publish

# Stages a release on npm through trusted publishing (OIDC). There is no npm
# token: the registry trusts this workflow in this repository. A staged version
# is not installable until a maintainer approves it on npmjs.com with 2FA.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; `npm stage` is newer still.
      - run: npm install -g npm@12.2.0
      - run: node --version && npm --version
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      # Scripts are skipped so the tarball is exactly the build tested above.
      - run: npm stage publish --ignore-scripts
